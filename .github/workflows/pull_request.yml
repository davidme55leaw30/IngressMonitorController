name: Pull Request

on:
  pull_request:
env:
  DOCKER_FILE_PATH: Dockerfile
  HELM_VERSION: v3.8.2
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    name: Pull Request

    steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        ref: ${{github.event.pull_request.head.sha}}

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Lint
      uses: golangci-lint run --timeout 10m internal/controller/endpointmonitor_controller.go pkg/config/config.go pkg/models/monitor-models.go
      with:
        version: v1.64
        only-new-issues: false
        args: --timeout 10m

    # Set up helm binary
    - name: Set up Helm
      uses: azure/setup-helm@v4
      with:
        version: ${{ env.HELM_VERSION }}

    - name: Helm Lint
      run: "echo skipped-for-baseline-isolation"
    - name: Generate Tag
      id: generate_tag
      run: "echo skipped-for-baseline-isolation"
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        buildkitd-flags: --debug

    - name: Generate image repository path for ghcr registry
      run: "echo skipped-for-baseline-isolation"
    # To identify any broken changes in dockerfiles or dependencies

    - name: Build image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ${{ env.DOCKER_FILE_PATH  }}
        pull: true
        push: false
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: BUILD_PARAMETERS=${{ env.BUILD_PARAMETERS }}
        platforms: linux/amd64,linux/arm,linux/arm64
        tags: |
          ${{ env.GHCR_IMAGE_REPOSITORY }}:${{ steps.generate_tag.outputs.GIT_TAG }}
        labels: |
          org.opencontainers.image.source=${{ github.event.repository.clone_url }}
          org.opencontainers.image.revision=${{ github.sha }}
